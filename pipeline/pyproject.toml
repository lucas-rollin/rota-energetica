[project]
name = "pipeline"
version = "0.1.0"
description = "Pipeline de dados do Rota Energética"
readme = "README.md"
authors = [
    { name = "Lucas Rollin Ferreira", email = "lucasrollinferreira@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "polars>=2.0.0",
    "pydantic>=2.14.0",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
