name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline-checks:
    name: Python Pipeline Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pipeline/pyproject.toml"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install pipeline dependencies
        run: |
          cd pipeline
          uv sync

      - name: Run Ruff Lint
        run: |
          cd pipeline
          uv run ruff check .

      - name: Run Ruff Format Check
        run: |
          cd pipeline
          uv run ruff format --check .

      - name: Run Pyrefly Type Check
        run: |
          cd pipeline
          uv run pyrefly check

      - name: Run Pytest
        run: |
          cd pipeline
          uv run pytest

  web-checks:
    name: Web Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "web/pnpm-lock.yaml"

      - name: Install web dependencies
        run: |
          cd web
          pnpm install --frozen-lockfile

      - name: Run Vitest Unit Tests
        run: |
          cd web
          pnpm test

      - name: Run Astro Type Check
        run: |
          cd web
          pnpm check

      - name: Build Astro Website
        run: |
          cd web
          pnpm build

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [pipeline-checks, web-checks]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "web/pnpm-lock.yaml"

      - name: Install web dependencies
        run: |
          cd web
          pnpm install --frozen-lockfile

      - name: Build Website for Pages
        run: |
          cd web
          pnpm build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
